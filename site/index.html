<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球职业地图</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --fg: #e0e0e8;
  --fg2: #888894;
  --accent: #6c8aff;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

#wrapper {
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding-bottom: 250px;
}

#header {
  padding: 20px 28px 16px;
  flex-shrink: 0;
}

.intro {
  margin-bottom: 14px;
}
.intro h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.intro p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg2);
  margin-bottom: 6px;
}
.intro a { color: var(--fg2); }
.intro strong, .intro b { color: var(--fg); font-weight: 600; }
.intro .source-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
  align-items: center;
}
.intro .source-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg2);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 2px 8px;
  text-decoration: none;
  transition: all 0.15s;
}
a.source-tag { cursor: pointer; }
a.source-tag:hover {
  color: var(--accent);
  border-color: rgba(108,138,255,0.45);
  background: rgba(108,138,255,0.08);
}
a.source-tag .ext-icon {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  opacity: 0.7;
}

/* Country tabs */
.country-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.country-tab {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg2);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.country-tab:hover { color: var(--fg); background: rgba(255,255,255,0.03); }
.country-tab.active {
  color: var(--fg);
  border-bottom-color: var(--accent);
}
.country-tab .flag { font-size: 18px; }
.country-tab .jobs-count {
  font-size: 11px;
  color: var(--fg2);
  font-weight: 400;
}

.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 20px 28px;
  align-items: flex-start;
  margin-bottom: 12px;
}

.stat-section {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat-section h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0.08em;
  color: var(--fg2);
}
.stat-big {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: var(--fg2);
}

.tier-bar { display: flex; flex-direction: column; gap: 3px; }
.tier-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.tier-color { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tier-name { flex: 1; color: var(--fg2); white-space: nowrap; }
.tier-jobs { text-align: right; white-space: nowrap; }
.tier-pct { text-align: right; width: 30px; color: var(--fg2); font-size: 11px; }

.histogram { display: flex; align-items: flex-end; gap: 2px; height: 54px; }
.histogram .bar { flex: 1; border-radius: 1px 1px 0 0; min-height: 1px; }
.hist-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--fg2); margin-top: 2px; }

.hbar-chart { display: flex; flex-direction: column; gap: 3px; }
.hbar-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.hbar-label { width: 85px; flex-shrink: 0; color: var(--fg2); font-size: 11px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { flex: 1; height: 12px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; min-width: 36px; }
.hbar-fill { height: 100%; border-radius: 2px; }
.hbar-val { width: 42px; flex-shrink: 0; font-size: 11px; color: var(--fg); text-align: right; }

.controls-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.color-toggle {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.color-toggle button {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s;
}
.color-toggle button.active {
  background: rgba(255,255,255,0.08);
  color: var(--fg);
  border-color: rgba(255,255,255,0.2);
}
.color-toggle button:hover:not(.active) {
  background: rgba(255,255,255,0.04);
}
.color-toggle button:disabled { opacity: 0.5; cursor: wait; }

.gradient-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg2);
}
.gradient-legend canvas { border-radius: 2px; }

.color-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: center;
  padding: 8px 0;
  font-size: 12px;
  color: var(--fg2);
}
.color-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.color-legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}

canvas#canvas {
  display: block;
  cursor: default;
}

#tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg2);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.5;
  max-width: min(380px, calc(100vw - 16px));
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 20;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#tooltip.visible { opacity: 1; }
#tooltip .tt-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: #fff; }
#tooltip .tt-title-en { font-size: 12px; color: var(--fg2); margin-bottom: 6px; }
#tooltip .tt-highlight { font-size: 12px; margin-bottom: 8px; }
#tooltip .tt-stats { display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; }
#tooltip .tt-stats .label { color: var(--fg2); }
#tooltip .tt-stats .value { color: var(--fg); text-align: right; }
#tooltip .tt-rationale { font-size: 11px; color: var(--fg2); margin-top: 8px; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }

.exposure-note { padding: 12px 15px; margin: 4px 0 16px; border: 1px solid rgba(108,138,255,0.25); border-radius: 6px; background: rgba(108,138,255,0.05); font-size: 12px; color: var(--fg2); line-height: 1.7; }
.exposure-note strong { color: var(--fg); }
.exposure-note a, .stat-label a, #exposureDetails a { color: var(--accent); }
.exposure-note .source-links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; }
.exposure-note select { max-width: 100%; margin-top: 8px; padding: 5px 8px; background: var(--bg2); color: var(--fg); border: 1px solid var(--fg2); border-radius: 4px; }
#exposureDetails { margin: auto; width: min(880px, calc(100vw - 32px)); max-height: 85vh; overflow: auto; background: var(--bg2); color: var(--fg); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 24px; font-size: 13px; line-height: 1.65; }
#exposureDetails::backdrop { background: rgba(0,0,0,0.7); }
.dialog-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.dialog-heading h2 { font-size: 20px; }
.dialog-heading button { color: var(--fg); background: transparent; border: 1px solid var(--fg2); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.detail-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
.detail-table th, .detail-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); vertical-align: top; }
.detail-table th { color: var(--fg2); font-weight: 500; }
.detail-table .num { white-space: nowrap; text-align: right; }
.muted { color: var(--fg2); }

@media (max-width: 600px) {
  #header { padding: 18px 16px; }
  .country-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .country-tab { padding: 10px 6px; font-size: 12px; gap: 4px; min-width: 0; }
  .country-tab .flag { font-size: 16px; }
  .country-tab .jobs-count { font-size: 10px; }
  .stat-section { max-width: 100%; min-width: 0; }
  .source-tag { max-width: 100%; overflow-wrap: anywhere; }
  .color-toggle button { white-space: nowrap; }
}

/* Loading */
.loading-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 400px;
  color: var(--fg2);
  font-size: 16px;
}
.loading-overlay .spinner {
  width: 24px;
  height: 24px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="wrapper">
<div id="header">
  <div class="intro">
    <h1 id="pageTitle">全球职业地图</h1>
    <p id="pageDesc">数据加载中...</p>
  </div>

  <div class="country-tabs" id="countryTabs"></div>

  <div class="controls-row">
    <div class="stat-section">
      <h3>图层</h3>
      <div class="color-toggle" id="colorToggle">
        <button disabled data-mode="share_change" class="active">就业趋势</button>
        <button disabled data-mode="skill">职业技能等级</button>
        <button disabled data-mode="exposure">GenAI 暴露度</button>
        <button disabled data-mode="gender">性别比例</button>
      </div>
    </div>
    <div class="gradient-legend">
      <span id="legendLow">下降</span>
      <canvas id="gradientLegend" width="80" height="8"></canvas>
      <span id="legendHigh">增长</span>
    </div>
  </div>
  <div class="color-legend" id="colorLegend"></div>
  <div id="dataNote" class="exposure-note" aria-live="polite"></div>
  <div id="exposureNote" class="exposure-note" hidden></div>

  <div class="stats-row">
    <div class="stat-section">
      <h3>图示就业规模</h3>
      <div class="stat-big" id="statTotalJobs">&mdash;</div>
    </div>
    <div class="stat-section" id="block2"></div>
    <div class="stat-section" id="block3"></div>
    <div class="stat-section" id="block4"></div>
    <div class="stat-section" id="block5"></div>
    <div class="stat-section" id="block6"></div>
    <div class="stat-section" id="block7"></div>
    <div class="stat-section" id="block8"></div>
  </div>
</div>

<canvas id="canvas"></canvas>
</div>

<div id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-title-en"></div>
  <div class="tt-highlight"></div>
  <div class="tt-stats"></div>
  <div class="tt-rationale"></div>
</div>

<dialog id="exposureDetails" aria-labelledby="exposureDetailTitle">
  <div class="dialog-heading">
    <h2 id="exposureDetailTitle"></h2>
    <button id="closeExposureDetails" type="button">关闭</button>
  </div>
  <div id="exposureDetailBody"></div>
</dialog>

<script>
// ── State ───────────────────────────────────────────────────────────────
let allData = null;
let currentCountry = 'IND';
let colorMode = 'share_change';
let data = [];
let countryMeta = {};
let rects = [];
let hovered = null;

const FLAGS = { IND: '\u{1F1EE}\u{1F1F3}', NGA: '\u{1F1F3}\u{1F1EC}', IDN: '\u{1F1EE}\u{1F1E9}', RUS: '\u{1F1F7}\u{1F1FA}', PAK: '\u{1F1F5}\u{1F1F0}', KEN: '\u{1F1F0}\u{1F1EA}' };

const EXPOSURE_BANDS = [
  { label: '0–<0.2', lo: 0, hi: 0.2, mid: 0.1 },
  { label: '0.2–<0.4', lo: 0.2, hi: 0.4, mid: 0.3 },
  { label: '0.4–<0.6', lo: 0.4, hi: 0.6, mid: 0.5 },
  { label: '0.6–<0.8', lo: 0.6, hi: 0.8, mid: 0.7 },
  { label: '0.8–1.0', lo: 0.8, hi: 1, mid: 0.9 },
];
const GRADIENT_LABELS = {
  'Not Exposed': '未归入暴露类别', 'Minimal Exposure': '最低程度暴露',
  'Exposed: Gradient 1': '暴露梯度 1', 'Exposed: Gradient 2': '暴露梯度 2',
  'Exposed: Gradient 3': '暴露梯度 3', 'Exposed: Gradient 4': '暴露梯度 4',
};
function exposureNumber(v) { return v == null ? '无数据' : v.toFixed(2); }
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function updateExposureNote() {
  const el = document.getElementById('exposureNote');
  el.hidden = colorMode !== 'exposure';
  if (el.hidden) return;
  const src = allData.genai_reference.source;
  const digits = currentCountry === 'IND' ? '三位' : '两位';
  el.innerHTML = `<strong>生成式 AI 技术暴露潜力 · ILO/NASK 2025 · 0–1 原始量表</strong><br>
    颜色表示职业组参考均分：将该${digits}职业组下已匹配的四位职业分数等权平均，再按本国就业人数计算整体参考值。
    分数越高，任务的技术暴露潜力越高；不代表实际采用率、失业概率或可替代任务比例。<br>
    <strong>全球职业基准，未按本国任务或 AI 普及率校准。</strong> 技术基准：2025 年初；就业数据：${countryMeta.data_year} 年。
    各国调查年份和职业粒度不同，不宜作精确排名。点击地图职业组可查看原始细分分数。${currentCountry === 'IND' ? '印度就业权重为换算值，其限制见上方数据口径。' : ''}
    <div class="source-links">
      <a href="${src.paper_url}" target="_blank" rel="noopener noreferrer">ILO 官方研究</a>
      <a href="${src.workbook_url}" target="_blank" rel="noopener noreferrer">作者原始工作簿</a>
      <a href="ai-exposure-methodology.html" target="_blank" rel="noopener noreferrer">计算方式、数据范围与限制</a>
    </div>
    <label for="exposureOccupation">查看职业组明细：</label>
    <select id="exposureOccupation"><option value="">选择职业组</option>
      ${data.map(d => `<option value="${d.code}">${escapeHTML(d.title)}（${d.code}）</option>`).join('')}
    </select>`;
  document.getElementById('exposureOccupation').addEventListener('change', (e) => {
    const occupation = data.find(d => d.code === e.target.value);
    if (occupation) showExposureDetails(occupation);
    e.target.value = '';
  });
}
function showExposureDetails(d) {
  hideTooltip();
  const reference = allData.genai_reference;
  const selected = new Set(d.exposure_unit_codes || []);
  const rows = reference.occupations.filter(o => selected.has(o.code));
  document.getElementById('exposureDetailTitle').textContent = `${d.title} · GenAI 评分依据`;
  const summary = rows.length
    ? `职业组参考均分 <strong>${exposureNumber(d.exposure)}</strong> / 1；组内细分职业均分范围
       ${exposureNumber(d.exposure_min)}–${exposureNumber(d.exposure_max)}。以下 ${rows.length} 个四位职业等权平均，未使用组内本国就业权重。`
    : '该职业组在 ILO/NASK 2025 参考数据中未匹配，均分为空，未纳入整体参考均分。';
  document.getElementById('exposureDetailBody').innerHTML = `<p>${summary}</p>
    <p class="muted">下表为作者公布的四位职业均分、任务分数标准差（SD）和分档。分档同时考虑均分与 SD，不能由上面的职业组平均分直接推断；未归入暴露类别也不等于分数为零。</p>
    <p><a href="${reference.source.workbook_url}" target="_blank" rel="noopener noreferrer">原始数据（Sheet1）</a> ·
    <a href="${reference.source.paper_url}#page=40" target="_blank" rel="noopener noreferrer">官方论文定义</a> ·
    <a href="ai-exposure-methodology.html" target="_blank" rel="noopener noreferrer">映射与计算说明</a></p>
    ${rows.length ? `<table class="detail-table"><thead><tr><th>ISCO-08</th><th>细分职业（原文）</th><th class="num">均分</th><th class="num">SD</th><th>原始分档</th></tr></thead><tbody>
    ${rows.map(o => `<tr><td>${o.code}</td><td>${escapeHTML(o.title_en)}</td><td class="num">${o.mean.toFixed(2)}</td><td class="num">${o.sd.toFixed(2)}</td><td title="${escapeHTML(o.gradient)}">${GRADIENT_LABELS[o.gradient] || escapeHTML(o.gradient)}</td></tr>`).join('')}
    </tbody></table>` : ''}`;
  document.getElementById('exposureDetails').showModal();
}
document.getElementById('closeExposureDetails').addEventListener('click', () => document.getElementById('exposureDetails').close());
document.getElementById('exposureDetails').addEventListener('close', () => {
  document.querySelector('#colorToggle button[data-mode="exposure"]').focus();
});

// ── Color scales ────────────────────────────────────────────────────────
function boostContrast(t) {
  const c = (t - 0.5) * 2;
  const b = Math.sign(c) * Math.pow(Math.abs(c), 0.55);
  return b / 2 + 0.5;
}

function greenRedCSS(t, alpha) {
  t = boostContrast(Math.max(0, Math.min(1, t)));
  let r, g, b;
  if (t < 0.5) {
    const s = t / 0.5;
    r = Math.round(30 + s * 200);
    g = Math.round(180 - s * 20);
    b = Math.round(40 - s * 20);
  } else {
    const s = (t - 0.5) / 0.5;
    r = Math.round(230 + s * 25);
    g = Math.round(160 - s * 130);
    b = Math.round(20 - s * 5);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

function shareChangeColor(v, a) {
  if (v == null) return `rgba(80,80,100,${a})`;
  // Map share change: -5 (red) to +5 (green)
  return greenRedCSS(1 - Math.max(0, Math.min(1, (v + 5) / 10)), a);
}

function eduColor(idx, maxIdx, a) {
  if (idx == null || idx < 0 || maxIdx <= 0) return `rgba(128,128,128,${a})`;
  return greenRedCSS(1 - idx / maxIdx, a);
}

function exposureColor(v, a) {
  if (v == null) return `rgba(128,128,128,${a})`;
  return greenRedCSS(v, a);
}

// Gender: diverging blue (male) <-> pink (female), by female share 0-100
function genderColor(femaleShare, a) {
  if (femaleShare == null) return `rgba(128,128,128,${a})`;
  const t = Math.max(0, Math.min(1, femaleShare / 100));
  // male end #3B82F6 (59,130,246) -> neutral #9AA0B5 (154,160,181) -> female end #EC4899 (236,72,153)
  let r, g, b;
  if (t < 0.5) {
    const s = t / 0.5;
    r = Math.round(59 + s * (154 - 59));
    g = Math.round(130 + s * (160 - 130));
    b = Math.round(246 + s * (181 - 246));
  } else {
    const s = (t - 0.5) / 0.5;
    r = Math.round(154 + s * (236 - 154));
    g = Math.round(160 + s * (72 - 160));
    b = Math.round(181 + s * (153 - 181));
  }
  return `rgba(${r},${g},${b},${a})`;
}

function tileColorCSS(d, alpha) {
  if (colorMode === 'exposure') return exposureColor(d.exposure, alpha);
  if (colorMode === 'share_change') return shareChangeColor(d.share_change, alpha);
  if (colorMode === 'gender') return genderColor(d.female_share, alpha);
  if (colorMode === 'skill') {
    const maxIdx = (countryMeta.skill_system?.levels?.length || 4) - 1;
    return eduColor(d.skill_idx, maxIdx, alpha);
  }
  return `rgba(128,128,128,${alpha})`;
}

function tileSubInfo(r) {
  const jobsStr = r.jobs ? formatNumber(r.jobs) : '';
  if (colorMode === 'exposure') {
    return (r.exposure != null ? 'GenAI ' + exposureNumber(r.exposure) + '/1' : 'GenAI 无数据') + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  if (colorMode === 'share_change') {
    const s = r.share_change != null ? (r.share_change > 0 ? '+' : '') + r.share_change.toFixed(1) + '\u767e\u5206\u70b9' : '';
    return s + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  if (colorMode === 'skill') {
    // Show short skill label
    const edu = r.skill || '';
    const short = edu.length > 20 ? edu.substring(0, edu.indexOf('（')) || edu.substring(0, 18) + '...' : edu;
    return short + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  if (colorMode === 'gender') {
    const s = r.female_share != null ? '\u5973 ' + r.female_share.toFixed(0) + '%' : '';
    return s + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  return jobsStr;
}

// ── Squarified treemap layout ──────────────────────────────────────────
function squarify(items, x, y, w, h) {
  if (items.length === 0) return [];
  if (items.length === 1) return [{ ...items[0], rx: x, ry: y, rw: w, rh: h }];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (total === 0) return [];
  const results = [];
  let remaining = [...items], cx = x, cy = y, cw = w, ch = h;
  while (remaining.length > 0) {
    const remTotal = remaining.reduce((s, d) => s + d.value, 0);
    const vertical = cw >= ch;
    const side = vertical ? ch : cw;
    let row = [remaining[0]], rowSum = remaining[0].value;
    for (let i = 1; i < remaining.length; i++) {
      const candidate = [...row, remaining[i]];
      const candidateSum = rowSum + remaining[i].value;
      if (worstAspect(candidate, candidateSum, side, remTotal, vertical ? cw : ch) <
          worstAspect(row, rowSum, side, remTotal, vertical ? cw : ch)) {
        row = candidate; rowSum = candidateSum;
      } else break;
    }
    const rowFraction = rowSum / remTotal;
    const rowThickness = vertical ? cw * rowFraction : ch * rowFraction;
    let offset = 0;
    for (const item of row) {
      const itemFraction = item.value / rowSum;
      const itemLength = side * itemFraction;
      if (vertical) results.push({ ...item, rx: cx, ry: cy + offset, rw: rowThickness, rh: itemLength });
      else results.push({ ...item, rx: cx + offset, ry: cy, rw: itemLength, rh: rowThickness });
      offset += itemLength;
    }
    if (vertical) { cx += rowThickness; cw -= rowThickness; }
    else { cy += rowThickness; ch -= rowThickness; }
    remaining = remaining.slice(row.length);
  }
  return results;
}

function worstAspect(row, rowSum, side, totalArea, availableExtent) {
  const rowExtent = availableExtent * (rowSum / totalArea);
  if (rowExtent === 0) return Infinity;
  let worst = 0;
  for (const item of row) {
    const itemLen = side * (item.value / rowSum);
    if (itemLen === 0) continue;
    const aspect = Math.max(rowExtent / itemLen, itemLen / rowExtent);
    if (aspect > worst) worst = aspect;
  }
  return worst;
}

// ── Rendering ──────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
const MARGIN = 12, GAP = 1.5;

function layout() {
  const wrapper = document.getElementById('wrapper');
  const w = wrapper.clientWidth;
  const h = Math.round(w * 3 / 4);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const tx = MARGIN, ty = MARGIN, tw = w - MARGIN * 2, th = h - MARGIN * 2;
  const byCategory = {};
  for (const d of data) { if (!byCategory[d.category]) byCategory[d.category] = []; byCategory[d.category].push(d); }
  const categories = Object.keys(byCategory).map(cat => ({
    cat, items: byCategory[cat].sort((a, b) => (b.jobs || 0) - (a.jobs || 0)),
    value: byCategory[cat].reduce((s, d) => s + (d.jobs || 1), 0),
  })).sort((a, b) => b.value - a.value);
  const catRects = squarify(categories, tx, ty, tw, th);
  rects = [];
  for (const cr of catRects) {
    const items = cr.items.map(d => ({ ...d, value: d.jobs || 1 }));
    const innerRects = squarify(items, cr.rx + GAP, cr.ry + GAP, cr.rw - GAP * 2, cr.rh - GAP * 2);
    for (const ir of innerRects) rects.push(ir);
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  for (const r of rects) {
    const isHovered = r === hovered;
    const g = GAP / 2, rx = r.rx + g, ry = r.ry + g, rw = r.rw - g * 2, rh = r.rh - g * 2;
    if (rw <= 0 || rh <= 0) continue;
    ctx.fillStyle = tileColorCSS(r, isHovered ? 0.8 : 0.5);
    ctx.fillRect(rx, ry, rw, rh);
    if (isHovered) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(rx, ry, rw, rh); }
    if (rw > 50 && rh > 18) {
      ctx.save(); ctx.beginPath(); ctx.rect(rx + 4, ry + 2, rw - 8, rh - 4); ctx.clip();
      const fontSize = Math.min(13, Math.max(9, Math.min(rw / 10, rh / 3)));
      ctx.font = `500 ${fontSize}px -apple-system, system-ui, sans-serif`;
      ctx.fillStyle = isHovered ? '#fff' : 'rgba(255,255,255,0.85)';
      ctx.textBaseline = 'top';
      ctx.fillText(r.title, rx + 5, ry + 4);
      if (rh > 34 && rw > 60) {
        ctx.font = `400 ${Math.max(8, fontSize - 2)}px -apple-system, system-ui, sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(tileSubInfo(r), rx + 5, ry + 4 + fontSize + 2);
      }
      ctx.restore();
    }
  }
}

function hitTest(mx, my) {
  const rect = canvas.getBoundingClientRect();
  const cx = mx - rect.left, cy = my - rect.top;
  for (let i = rects.length - 1; i >= 0; i--) {
    const r = rects[i];
    if (cx >= r.rx && cx < r.rx + r.rw && cy >= r.ry && cy < r.ry + r.rh) return r;
  }
  return null;
}

function formatNumber(n) {
  if (n == null) return '\u2014';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '\u4ebf';
  if (n >= 1e4) return (n / 1e4).toFixed(0) + '\u4e07';
  return n.toLocaleString();
}

function formatNumberEn(n) {
  if (n == null) return '\u2014';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return n.toLocaleString();
}

function tooltipHighlight(d) {
  if (colorMode === 'exposure') {
    const v = d.exposure;
    if (v == null) return '<span class="muted">GenAI：未匹配数据</span>';
    const color = exposureColor(v, 1);
    return `<span style="color:${color};font-weight:600;">职业组参考均分：${exposureNumber(v)} / 1</span>` +
      `<div style="margin-top:3px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;">` +
      `<div style="height:100%;width:${v * 100}%;background:${color};border-radius:2px;"></div></div>`;
  } else if (colorMode === 'share_change') {
    const v = d.share_change;
    if (v == null) return '<span style="color:var(--fg2);">就业份额变化：无数据</span>';
    const color = shareChangeColor(v, 1);
    return `<span style="color:${color};font-weight:600;">就业份额变化：${v > 0 ? '+' : ''}${v.toFixed(2)}百分点</span>` +
      (d.share_change_desc ? ` <span style="color:var(--fg2);">(${d.share_change_desc})</span>` : '') +
      `<div style="margin-top:3px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;">` +
      `<div style="height:100%;width:${Math.min(100, Math.max(0, (v + 5) / 10 * 100))}%;background:${color};border-radius:2px;"></div></div>`;
  } else if (colorMode === 'skill') {
    const edu = d.skill || '';
    const maxIdx = (countryMeta.skill_system?.levels?.length || 4) - 1;
    const color = d.skill_idx >= 0 ? eduColor(d.skill_idx, maxIdx, 1) : 'var(--fg)';
    return `<span style="color:${color};font-weight:600;">${edu || '\u2014'}</span>`;
  } else if (colorMode === 'gender') {
    const fs = d.female_share;
    if (fs == null) return '<span style="color:var(--fg2);">性别比例：无数据</span>';
    const maleColor = genderColor(0, 1), femaleColor = genderColor(100, 1);
    return `<span style="color:${genderColor(fs, 1)};font-weight:600;">女性占比：${fs.toFixed(1)}%　男性占比：${(100 - fs).toFixed(1)}%</span>` +
      `<div style="margin-top:3px;height:6px;display:flex;border-radius:3px;overflow:hidden;">` +
      `<div style="height:100%;width:${100 - fs}%;background:${maleColor};"></div>` +
      `<div style="height:100%;width:${fs}%;background:${femaleColor};"></div></div>`;
  }
  return '';
}

function showTooltip(d, mx, my) {
  const tt = document.getElementById('tooltip');
  tt.querySelector('.tt-title').textContent = d.title;
  tt.querySelector('.tt-title-en').textContent = d.title_en || '';

    ? `上级 ${d.sex_reference_code} 组女性 ${d.female_share.toFixed(1)}%（${d.sex_year}）`
    : `男 ${formatNumber(d.male)} / 女 ${formatNumber(d.female)}（${d.sex_year}）`;
  tt.querySelector('.tt-stats').innerHTML = `
    <span class="label">${d.jobs_method === 'scaled_plfs_person_share' ? '换算就业规模' : '就业人数'}</span><span class="value">${formatNumber(d.jobs)}</span>
    <span class="label">性别构成</span><span class="value">${genderStr}</span>
    <span class="label">份额变化</span><span class="value">${shareStr} ${d.share_change_desc ? '(' + d.share_change_desc + ')' : ''}</span>
    <span class="label">职业技能等级</span><span class="value">${d.skill || '\u2014'}</span>
    <span class="label">GenAI 参考均分</span><span class="value">${d.exposure != null ? exposureNumber(d.exposure) + ' / 1' : '无数据'}</span>
    <span class="label">ISCO 代码</span><span class="value">${d.code || '\u2014'}</span>
    <span class="label">原始质量标记</span><span class="value">${[...(d.jobs_status || []), ...(d.sex_status || [])].join(' / ') || '无附加标记'}</span>`;
  tt.querySelector('.tt-rationale').textContent = colorMode === 'exposure' ? (d.exposure_rationale || '') : colorMode === 'share_change' ? countryMeta.trend_note : colorMode === 'skill' ? countryMeta.skill_system.note : (d.sex_method === 'parent_l2_ratio' ? '上级组比例只作参考；未推算本三位职业的男女就业人数。' : 'U = 低可靠性，B = 统计口径断点。');
  const { width, height } = tt.getBoundingClientRect();

}

// ── Stats helpers ─────────────────────────────────────────────────────
function renderTiers(tiers, totalJobs) {
  return tiers.map(t => `<div class="tier-row">
    <div class="tier-color" style="background:${t.color}"></div>
    <span class="tier-name">${t.label}</span>
    <span class="tier-jobs">${formatNumber(t.jobs)}</span>
    <span class="tier-pct">${totalJobs > 0 ? (t.jobs / totalJobs * 100).toFixed(0) : 0}%</span>
  </div>`).join('');
}

function renderHbars(items) {
  return items.map(it => `<div class="hbar-row">
    <span class="hbar-label" title="${it.label}">${it.label}</span>
    <div class="hbar-track"><div class="hbar-fill" style="width:${it.pct}%;background:${it.color}"></div></div>
    <span class="hbar-val">${it.val}</span>
  </div>`).join('');
}

function weightedAvgByGroups(groups, filterFn, metricFn) {
  return groups.map(g => {
    let wS = 0, wC = 0;
    for (const d of data) {
      const v = metricFn(d);
      if (v != null && d.jobs && filterFn(d, g)) { wS += v * d.jobs; wC += d.jobs; }
    }
    return { ...g, avg: wC > 0 ? wS / wC : null, jobs: wC };
  });
}

// ── Layer stats ──────────────────────────────────────────────────────
function updateStats() {
  const totalJobs = data.reduce((s, d) => s + (d.jobs || 0), 0);
  document.getElementById('statTotalJobs').textContent = formatNumber(totalJobs);
  updateExposureNote();
  updateDataNote();

  if (colorMode === 'share_change') updateShareChangeStats(totalJobs);
  else if (colorMode === 'skill') updateSkillStats(totalJobs);
  else if (colorMode === 'exposure') updateExposureStats(totalJobs);
  else if (colorMode === 'gender') updateGenderStats(totalJobs);
}

function updateDataNote() {
  const s = countryMeta.employment_summary;
  const sex = countryMeta.gender_summary;
  let note = `<strong>${countryMeta.data_year} 年就业快照</strong> · 来源总量 ${formatNumber(s.source_total_jobs)} 人 · 两位职业分类覆盖 ${s.source_classification_coverage_pct.toFixed(1)}%。`;
  note += ` ${escapeHTML(s.notes)}`;
  if (colorMode === 'share_change') note += `<br><strong>趋势口径：</strong>${escapeHTML(countryMeta.trend_note)} 份额上升不等于就业人数增加。`;
  if (colorMode === 'skill') note += `<br><strong>技能口径：</strong>${escapeHTML(countryMeta.skill_system.note)}`;
  if (colorMode === 'gender') note += `<br><strong>性别口径：</strong>${sex.year} 年两位职业组；总体按上级组去重汇总，有男女数据的就业覆盖 ${sex.coverage_pct.toFixed(1)}%。${currentCountry === 'IND' ? '印度三位方块颜色沿用上级两位组比例，不能解读为三位职业的实际性别构成。' : ''}`;
  if (s.quality_flags.length) note += `<br>本国源表标记：${s.quality_flags.join('、')}。B = 统计口径断点；U = 低可靠性（按职业显示）。`;
  note += '<br><a href="data-methodology.html">查看来源版本、更新进度和数据限制</a> · 审核日期 2026-09-15；在线数据更新未核实。';
  document.getElementById('dataNote').innerHTML = note;
}

function updateGenderStats(totalJobs) {
  const summary = countryMeta.gender_summary;
  const {male, female} = summary;
  const tot = male + female, femaleShareAll = summary.female_share;
  const maleColor = genderColor(0, 1), femaleColor = genderColor(100, 1);
  document.getElementById('block2').innerHTML = femaleShareAll != null ? `<h3>已覆盖职业女性占比</h3>
    <div class="stat-big" style="color:${genderColor(femaleShareAll, 1)}">${femaleShareAll.toFixed(1)}%</div>
    <div class="stat-label">${summary.year} 年 · 两位职业去重汇总</div>` : '<h3>性别数据</h3><div class="stat-big">无数据</div>';
  document.getElementById('block3').innerHTML = tot > 0 ? `<h3>已覆盖两位职业人数</h3>
    <div style="display:flex;height:22px;border-radius:4px;overflow:hidden;margin-top:6px">
      <div style="width:${male/tot*100}%;background:${maleColor}"></div><div style="width:${female/tot*100}%;background:${femaleColor}"></div>
    </div><div class="hist-labels"><span>男 ${formatNumber(male)}</span><span>女 ${formatNumber(female)}</span></div>` : '';
  // Rank independent source groups, so inherited India ratios are not duplicated.
  const withSex = [...new Map(data.filter(d => d.female_share != null).map(d => [d.sex_reference_code, d])).values()];
  const show = (items, field) => renderHbars(items.map(d => ({label: currentCountry === 'IND' ? `两位职业 ${d.sex_reference_code}` : d.title,
    val: (field === 'male' ? 100-d.female_share : d.female_share).toFixed(1)+'%',
    pct: field === 'male' ? 100-d.female_share : d.female_share, color: genderColor(d.female_share, 0.85)})));
  document.getElementById('block4').innerHTML = `<h3>男性占比较高的职业组</h3><div class="hbar-chart">${show([...withSex].sort((a,b)=>a.female_share-b.female_share).slice(0,6),'male')}</div>`;
  document.getElementById('block5').innerHTML = `<h3>女性占比较高的职业组</h3><div class="hbar-chart">${show([...withSex].sort((a,b)=>b.female_share-a.female_share).slice(0,6),'female')}</div>`;
  document.getElementById('block6').innerHTML = `<h3>性别统计覆盖</h3><div class="stat-big">${summary.coverage_pct.toFixed(1)}%</div><div class="stat-label">占来源就业总量；不补齐缺失性别</div>`;
  document.getElementById('block7').innerHTML = `<h3>原始质量标记</h3><div class="stat-label">鼠标移到职业方块查看。U 标记数据保留，但可靠性较低。</div>`;
  document.getElementById('block8').innerHTML = '';
}

function updateShareChangeStats(totalJobs) {
  // Coverage of available share-change references
  let wC = 0;
  for (const d of data) { if (d.share_change != null && d.jobs) wC += d.jobs; }
  const hasShareData = wC > 0;

  document.getElementById('block2').innerHTML = `<h3>可计算趋势覆盖</h3>
    <div class="stat-big">${totalJobs ? (wC / totalJobs * 100).toFixed(1) : '0'}%</div>
    <div class="stat-label">占图示就业；缺失/不可比端点不计算</div>`;

  // Histogram: jobs by share change buckets
  if (hasShareData) {
    const buckets = [
      { lo: -Infinity, hi: -2, mid: -4 }, { lo: -2, hi: -0.5, mid: -1.2 }, { lo: -0.5, hi: 0.5, mid: 0 },
      { lo: 0.5, hi: 2, mid: 1.2 }, { lo: 2, hi: Infinity, mid: 4 },
    ];
    const histJobs = buckets.map(() => 0);
    for (const d of data) { if (d.share_change != null && d.jobs) { const i = buckets.findIndex(b => d.share_change >= b.lo && d.share_change < b.hi); if (i >= 0) histJobs[i] += d.jobs; } }
    const maxH = Math.max(...histJobs);
    document.getElementById('block3').innerHTML = `<h3>各趋势就业分布</h3>
      <div class="histogram">${histJobs.map((c, i) => `<div class="bar" style="height:${Math.max(2, maxH > 0 ? c / maxH * 100 : 0)}%;background:${shareChangeColor(buckets[i].mid, 0.7)}"></div>`).join('')}</div>
      <div class="hist-labels"><span>&lt;−2</span><span>−0.5～0.5</span><span>≥2 百分点</span></div>`;

    // Tiers
    const tierDefs = [
      { label: '下降 (<-1百分点)', min: -Infinity, max: -1, mid: -3 },
      { label: '微降 (-1~0)', min: -1, max: 0, mid: -0.5 },
      { label: '不变 (0)', min: 0, max: 0.01, mid: 0 },
      { label: '微升 (0~+1)', min: 0.01, max: 1, mid: 0.5 },
      { label: '上升 (≥+1百分点)', min: 1, max: Infinity, mid: 3 },
    ];
    const tiers = tierDefs.map(t => {
      let jobs = 0;
      for (const d of data) { if (d.share_change != null && d.jobs && d.share_change >= t.min && d.share_change < t.max) jobs += d.jobs; }
      return { ...t, label: t.label, jobs, color: shareChangeColor(t.mid, 1) };
    });
    document.getElementById('block4').innerHTML = `<h3>趋势分层</h3><div class="tier-bar">${renderTiers(tiers, totalJobs)}</div>`;
  } else {
    document.getElementById('block3').innerHTML = `<h3>数据年份</h3><div class="stat-big" style="font-size:24px">${countryMeta.data_year || '--'}</div>`;
    document.getElementById('block4').innerHTML = '';
  }

  const majorList = (countryMeta.major_share_changes || []).map(g => ({...g,
    label: g.category.split('-').slice(1).join('-'), avg: g.change})).sort((a,b)=>b.avg-a.avg);
  const renderMajor = groups => renderHbars(groups.map(g => ({label: g.label,
    val: (g.avg > 0 ? '+' : '') + g.avg.toFixed(2) + '百分点',
    pct: Math.min(100,Math.abs(g.avg)*20), color: shareChangeColor(g.avg,0.8)})));
  document.getElementById('block5').innerHTML = `<h3>份额上升的职业大类</h3><div class="hbar-chart">${renderMajor(majorList.filter(g=>g.avg>0).slice(0,5))}</div>`;
  document.getElementById('block6').innerHTML = `<h3>份额下降的职业大类</h3><div class="hbar-chart">${renderMajor(majorList.filter(g=>g.avg<0).reverse().slice(0,5))}</div>`;

  // Declining/growing total jobs
  let declining = 0, growing = 0;
  for (const d of data) {
    if (d.share_change != null && d.jobs) {
      if (d.share_change < 0) declining += d.jobs;
      else if (d.share_change > 0) growing += d.jobs;
    }
  }
  if (hasShareData) {
    document.getElementById('block7').innerHTML = `<h3>份额下降组的图示就业</h3>
      <div class="stat-big" style="color:${shareChangeColor(-3, 1)}">${formatNumber(declining)}</div>
      <div class="stat-label">表示职业组当前规模，不是减少人数</div>`;
    document.getElementById('block8').innerHTML = `<h3>份额上升组的图示就业</h3>
      <div class="stat-big" style="color:${shareChangeColor(3, 1)}">${formatNumber(growing)}</div>
      <div class="stat-label">表示职业组当前规模，不是新增人数</div>`;
  } else {
    document.getElementById('block7').innerHTML = `<h3>数据来源</h3><div class="stat-label" style="font-size:12px;margin-top:4px">${countryMeta.source || 'ILO ILOSTAT'}</div>`;
    document.getElementById('block8').innerHTML = '';
  }
}

function updateSkillStats(totalJobs) {
  const levels = countryMeta.skill_system.levels;
  const groups = levels.map((lev,i)=>({label: lev[0].split('（')[0], idx:i,
    jobs:data.filter(d=>d.skill_idx===i).reduce((s,d)=>s+d.jobs,0)}));
  const high = groups.filter(g=>g.idx>=2).reduce((s,g)=>s+g.jobs,0);
  document.getElementById('block2').innerHTML = `<h3>技能等级 3–4 的职业组</h3><div class="stat-big">${(high/totalJobs*100).toFixed(1)}%</div><div class="stat-label">占图示就业；不代表高学历人口</div>`;
  const max = Math.max(...groups.map(g=>g.jobs),1);
  document.getElementById('block3').innerHTML = `<h3>技能等级分布</h3><div class="histogram">${groups.map(g=>`<div class="bar" style="height:${g.jobs/max*100}%;background:${eduColor(g.idx,3,0.8)}"></div>`).join('')}</div><div class="hist-labels"><span>等级 1</span><span>等级 4</span></div>`;
  document.getElementById('block4').innerHTML = `<h3>各技能等级图示就业</h3><div class="tier-bar">${renderTiers(groups.map(g=>({...g,color:eduColor(g.idx,3,0.8)})),totalJobs)}</div>`;
  const ex = weightedAvgByGroups(groups,(d,g)=>d.skill_idx===g.idx,d=>d.exposure);
  document.getElementById('block5').innerHTML = `<h3>各技能等级 GenAI 参考均分</h3><div class="hbar-chart">${renderHbars(ex.map(g=>({label:g.label,val:exposureNumber(g.avg),pct:g.avg==null?0:g.avg*100,color:exposureColor(g.avg,0.8)})))}</div>`;
  document.getElementById('block6').innerHTML = '<h3>技能不等于学历</h3><div class="stat-label">等级按任务复杂度定义，技能可以来自正规教育、培训和工作经验。</div>';
  document.getElementById('block7').innerHTML = `<h3>分类依据</h3><div class="stat-label"><a href="${countryMeta.skill_system.source_url}" target="_blank" rel="noopener noreferrer">ILO ISCO-08 官方定义</a></div>`;
  document.getElementById('block8').innerHTML = '';
}

function updateExposureStats(totalJobs) {
  const summary = countryMeta.genai_summary;
  const avg = summary.mean;
  document.getElementById('block2').innerHTML = `<h3>就业加权参考均分</h3>
    <div class="stat-big" style="color:${exposureColor(avg, 1)}">${exposureNumber(avg)}</div>
    <div class="stat-label">0–1；仅纳入可匹配就业</div>`;

  // Numeric display bands, NOT the ILO's mean-and-SD exposure gradients.
  const histogram = new Array(10).fill(0);
  for (const d of data) {
    if (d.exposure != null && d.jobs) histogram[Math.min(9, Math.floor(d.exposure * 10 + 1e-10))] += d.jobs;
  }
  const maxH = Math.max(...histogram);
  document.getElementById('block3').innerHTML = `<h3>参考分数段就业分布</h3>
    <div class="histogram">${histogram.map((c, i) => `<div class="bar" title="${(i / 10).toFixed(1)}–${((i + 1) / 10).toFixed(1)}：${formatNumber(c)}人" style="height:${Math.max(2, maxH > 0 ? c / maxH * 100 : 0)}%;background:${exposureColor((i + 0.5) / 10, 0.7)}"></div>`).join('')}</div>
    <div class="hist-labels"><span>0</span><span>0.5</span><span>1</span></div>`;

  const tiers = EXPOSURE_BANDS.map(t => ({
    ...t, color: exposureColor(t.mid, 1),
    jobs: data.reduce((n, d) => {
      const v = d.exposure == null ? null : Number(d.exposure.toFixed(10));
      return n + (v != null && v >= t.lo && (v < t.hi || (t.hi === 1 && v === 1)) ? d.jobs || 0 : 0);
    }, 0),
  }));
  if (summary.unmatched_jobs > 0) tiers.push({ label: '未匹配', jobs: summary.unmatched_jobs, color: exposureColor(null, 1) });
  document.getElementById('block4').innerHTML = `<h3>分数段就业占比</h3><div class="tier-bar">${renderTiers(tiers, totalJobs)}</div>
    <div class="stat-label">展示分段，非 ILO 暴露梯度</div>`;

  const byMajor = {};
  for (const d of data) {
    if (d.exposure != null && d.jobs) {
      const key = d.category;
      if (!byMajor[key]) byMajor[key] = { sum: 0, jobs: 0, label: key.split('-')[1] || key };
      byMajor[key].sum += d.exposure * d.jobs;
      byMajor[key].jobs += d.jobs;
    }
  }
  const groups = Object.values(byMajor).map(g => ({ ...g, avg: g.sum / g.jobs })).sort((a, b) => b.avg - a.avg);
  document.getElementById('block5').innerHTML = `<h3>各职业大类参考均分</h3><div class="hbar-chart">${renderHbars(groups.slice(0, 6).map(g => ({
    label: g.label, val: g.avg.toFixed(2), pct: g.avg * 100, color: exposureColor(g.avg, 0.8)
  })))}</div>`;

  const levels = countryMeta.skill_system?.levels || [];
  const eduGroups = levels.map((lev, i) => ({ label: lev[0].split('（')[0], idx: i }));
  const byEdu = weightedAvgByGroups(eduGroups, (d, g) => d.skill_idx === g.idx, d => d.exposure);
  document.getElementById('block6').innerHTML = `<h3>各技能等级参考均分</h3><div class="hbar-chart">${renderHbars(byEdu.map(g => ({
    label: g.label, val: g.jobs ? g.avg.toFixed(2) : '无数据', pct: g.avg == null ? 0 : g.avg * 100, color: exposureColor(g.jobs ? g.avg : null, 0.8)
  })))}</div>`;

  document.getElementById('block7').innerHTML = `<h3>GenAI 在图示就业中的覆盖</h3>
    <div class="stat-big">${summary.employment_coverage_pct == null ? '无数据' : summary.employment_coverage_pct.toFixed(1) + '%'}</div>
    <div class="stat-label">${summary.matched_group_count}/${summary.group_count} 个地图职业组</div>
    <div class="stat-label">未匹配就业：${formatNumber(summary.unmatched_jobs)}人</div>`;

  document.getElementById('block8').innerHTML = `<h3>组内构成未知时的参考范围</h3>
    <div class="stat-big" style="font-size:24px">${exposureNumber(summary.composition_min)}–${exposureNumber(summary.composition_max)}</div>
    <div class="stat-label">细分职业最低/最高均分加权</div>
    <div class="stat-label">仅可匹配就业；非置信区间</div>`;
}

// ── Events ─────────────────────────────────────────────────────────────
canvas.addEventListener('click', (e) => {
  if (colorMode !== 'exposure') return;
  const hit = hitTest(e.clientX, e.clientY);
  if (hit) showExposureDetails(hit);
});
canvas.addEventListener('mousemove', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit !== hovered) { hovered = hit; draw(); }
  if (hovered) { showTooltip(hovered, e.clientX, e.clientY); canvas.style.cursor = 'pointer'; }
  else { hideTooltip(); canvas.style.cursor = 'default'; }
});
canvas.addEventListener('mouseleave', () => { hovered = null; hideTooltip(); draw(); });
function resize() { dpr = window.devicePixelRatio || 1; layout(); draw(); }

// ── Legend gradient ────────────────────────────────────────────────────
const LEGEND_CONFIG = {
  exposure:     { low: '0 · 低', high: '1 · 高' },
  share_change: { low: '份额下降', high: '份额上升' },
  skill:    { low: '等级 1', high: '等级 4' },
  gender:       { low: '男性', high: '女性' },
};

function drawGradientLegend() {
  const c = document.getElementById('gradientLegend');
  const gctx = c.getContext('2d');
  for (let x = 0; x < 80; x++) {
    const t = x / 79;
    if (colorMode === 'gender') gctx.fillStyle = genderColor(t * 100, 1);
    else gctx.fillStyle = colorMode === 'exposure' ? greenRedCSS(t, 1) : greenRedCSS(1 - t, 1);
    gctx.fillRect(x, 0, 1, 8);
  }
  const cfg = LEGEND_CONFIG[colorMode];
  document.getElementById('legendLow').textContent = cfg.low;
  document.getElementById('legendHigh').textContent = cfg.high;
  updateColorLegend();
}

function updateColorLegend() {
  const el = document.getElementById('colorLegend');
  let items = [];

  if (colorMode === 'share_change') {
    items = [
      { color: shareChangeColor(4, 0.7),  label: '大幅上升 (>+2百分点)' },
      { color: shareChangeColor(1.5, 0.7), label: '\u5fae\u5347 (0~+2)' },
      { color: shareChangeColor(-1.5, 0.7), label: '\u5fae\u964d (-2~0)' },
      { color: shareChangeColor(-4, 0.7), label: '\u5927\u5e45\u4e0b\u964d (<-2\u767e\u5206\u70b9)' },
      { color: 'rgba(80,80,100,0.5)', label: '\u7070\u8272 = \u65e0\u5386\u53f2\u6570\u636e' },
    ];
  } else if (colorMode === 'skill') {
    const levels = countryMeta.skill_system?.levels || [];
    const maxIdx = levels.length - 1;
    items = levels.map((lev, i) => ({
      color: eduColor(i, maxIdx, 0.7),
      label: lev[0].substring(0, lev[0].indexOf('\uff08')) || lev[0],
    }));
  } else if (colorMode === 'exposure') {
    items = EXPOSURE_BANDS.map(t => ({ color: exposureColor(t.mid, 0.7), label: t.label }));
    items.push({ color: exposureColor(null, 0.5), label: '灰色 = 未匹配数据' });
  } else if (colorMode === 'gender') {
    items = [
      { color: genderColor(10, 0.8),  label: '\u7537\u6027\u4e3a\u4e3b (\u5973<20%)' },
      { color: genderColor(35, 0.8),  label: '\u504f\u7537\u6027 (\u597320\u201345%)' },
      { color: genderColor(50, 0.8),  label: '\u5747\u8861 (\u597345\u201355%)' },
      { color: genderColor(65, 0.8),  label: '\u504f\u5973\u6027 (\u597355\u201380%)' },
      { color: genderColor(90, 0.8),  label: '\u5973\u6027\u4e3a\u4e3b (\u5973>80%)' },
      { color: 'rgba(128,128,128,0.5)', label: '\u7070\u8272 = \u65e0\u6570\u636e' },
    ];
  }

  el.innerHTML = items.map(it =>
    `<span class="color-legend-item"><span class="color-legend-swatch" style="background:${it.color}"></span>${it.label}</span>`
  ).join('');
}

// ── Layer toggle ─────────────────────────────────────────────────────
document.getElementById('colorToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.mode) return;
  if (!allData) return;
  hovered = null; hideTooltip();
  colorMode = btn.dataset.mode;
  document.querySelectorAll('#colorToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateStats();
  drawGradientLegend();
  draw();
  requestAnimationFrame(resize);
});

// ── Country switch ───────────────────────────────────────────────────
function switchCountry(cc) {
  hovered = null; hideTooltip();
  currentCountry = cc;
  const cdata = allData.countries[cc];
  countryMeta = cdata;
  data = cdata.occupations;

  // Update tabs
  document.querySelectorAll('.country-tab').forEach(t => t.classList.toggle('active', t.dataset.cc === cc));

  // Update title/description + clickable source links
  document.getElementById('pageTitle').textContent = cdata.title;
  const EXT_ICON = `<svg class="ext-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2H2.2C1.5 2 1 2.5 1 3.2v6.6C1 10.5 1.5 11 2.2 11h6.6c.7 0 1.2-.5 1.2-1.2V7.5"/><path d="M7 1h4v4"/><path d="M11 1L5.5 6.5"/></svg>`;
  let sourceHtml = '';
  if (cdata.source_links && cdata.source_links.length > 0) {
    sourceHtml = `<div class="source-tags"><span class="source-tag" style="border:none;background:none;padding-left:0">就业数据来源：</span>` +
      cdata.source_links.map(l =>
        `<a class="source-tag" href="${l.url}" target="_blank" rel="noopener noreferrer" title="${l.url}">${l.label}${EXT_ICON}</a>`
      ).join('') + `</div>`;
  } else {
    sourceHtml = `<div class="source-tags"><span class="source-tag">${cdata.source}</span></div>`;
  }
  document.getElementById('pageDesc').innerHTML = cdata.description + sourceHtml;

  // Refresh viz
  updateStats();
  drawGradientLegend();
  resize();
}

function buildCountryTabs() {
  const container = document.getElementById('countryTabs');
  container.innerHTML = '';
  const order = ['IND', 'IDN', 'PAK', 'NGA', 'KEN', 'RUS'];
  for (const cc of order) {
    const cdata = allData.countries[cc];
    if (!cdata) continue;
    const btn = document.createElement('button');
    btn.className = 'country-tab';
    btn.dataset.cc = cc;
    btn.innerHTML = `<span class="flag">${FLAGS[cc] || ''}</span> ${cdata.name_cn} <span class="jobs-count">${formatNumber(cdata.total_jobs)}人</span>`;
    btn.addEventListener('click', () => switchCountry(cc));
    container.appendChild(btn);
  }
}

// ── Load ───────────────────────────────────────────────────────────────
fetch('data.json?v=review-20260915-v2')
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(d => {
    if (d.schema_version !== 2 || d.genai_reference?.source?.scale?.[1] !== 1) throw new Error('GenAI 数据版本不匹配，请刷新页面');
    allData = d;
    document.querySelectorAll('#colorToggle button').forEach(b => b.disabled = false);
    buildCountryTabs();
    switchCountry('IND');
  })
  .catch(err => {
    document.getElementById('pageDesc').textContent = '数据加载失败：' + err.message;
    document.querySelectorAll('#colorToggle button').forEach(b => b.disabled = true);
  });

window.addEventListener('resize', resize);
</script>
</body>
</html>
