<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球职业地图</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --fg: #e0e0e8;
  --fg2: #888894;
  --accent: #6c8aff;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

#wrapper {
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding-bottom: 250px;
}

#header {
  padding: 20px 28px 16px;
  flex-shrink: 0;
}

.intro {
  margin-bottom: 14px;
}
.intro h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.intro p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg2);
  margin-bottom: 6px;
}
.intro a { color: var(--fg2); }
.intro strong, .intro b { color: var(--fg); font-weight: 600; }
.intro .source-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
  align-items: center;
}
.intro .source-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--fg2);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 2px 8px;
  text-decoration: none;
  transition: all 0.15s;
}
a.source-tag { cursor: pointer; }
a.source-tag:hover {
  color: var(--accent);
  border-color: rgba(108,138,255,0.45);
  background: rgba(108,138,255,0.08);
}
a.source-tag .ext-icon {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  opacity: 0.7;
}

/* Country tabs */
.country-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.country-tab {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg2);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.country-tab:hover { color: var(--fg); background: rgba(255,255,255,0.03); }
.country-tab.active {
  color: var(--fg);
  border-bottom-color: var(--accent);
}
.country-tab .flag { font-size: 18px; }
.country-tab .jobs-count {
  font-size: 11px;
  color: var(--fg2);
  font-weight: 400;
}

.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 20px 28px;
  align-items: flex-start;
  margin-bottom: 12px;
}

.stat-section {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat-section h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0.08em;
  color: var(--fg2);
}
.stat-big {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: var(--fg2);
}

.tier-bar { display: flex; flex-direction: column; gap: 3px; }
.tier-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.tier-color { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tier-name { flex: 1; color: var(--fg2); white-space: nowrap; }
.tier-jobs { text-align: right; white-space: nowrap; }
.tier-pct { text-align: right; width: 30px; color: var(--fg2); font-size: 11px; }

.histogram { display: flex; align-items: flex-end; gap: 2px; height: 54px; }
.histogram .bar { flex: 1; border-radius: 1px 1px 0 0; min-height: 1px; }
.hist-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--fg2); margin-top: 2px; }

.hbar-chart { display: flex; flex-direction: column; gap: 3px; }
.hbar-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.hbar-label { width: 85px; flex-shrink: 0; color: var(--fg2); font-size: 11px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { flex: 1; height: 12px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; min-width: 36px; }
.hbar-fill { height: 100%; border-radius: 2px; }
.hbar-val { width: 42px; flex-shrink: 0; font-size: 11px; color: var(--fg); text-align: right; }

.controls-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.color-toggle {
  display: flex;
  gap: 4px;
}
.color-toggle button {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  background: transparent;
  color: var(--fg2);
  cursor: pointer;
  transition: all 0.15s;
}
.color-toggle button.active {
  background: rgba(255,255,255,0.08);
  color: var(--fg);
  border-color: rgba(255,255,255,0.2);
}
.color-toggle button:hover:not(.active) {
  background: rgba(255,255,255,0.04);
}

.gradient-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg2);
}
.gradient-legend canvas { border-radius: 2px; }

.color-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: center;
  padding: 8px 0;
  font-size: 12px;
  color: var(--fg2);
}
.color-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.color-legend-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  flex-shrink: 0;
}

canvas#canvas {
  display: block;
  cursor: default;
}

#tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg2);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.5;
  max-width: 380px;
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 20;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#tooltip.visible { opacity: 1; }
#tooltip .tt-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: #fff; }
#tooltip .tt-title-en { font-size: 12px; color: var(--fg2); margin-bottom: 6px; }
#tooltip .tt-highlight { font-size: 12px; margin-bottom: 8px; }
#tooltip .tt-stats { display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; }
#tooltip .tt-stats .label { color: var(--fg2); }
#tooltip .tt-stats .value { color: var(--fg); text-align: right; }
#tooltip .tt-rationale { font-size: 11px; color: var(--fg2); margin-top: 8px; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; }

/* Loading */
.loading-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 400px;
  color: var(--fg2);
  font-size: 16px;
}
.loading-overlay .spinner {
  width: 24px;
  height: 24px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="wrapper">
<div id="header">
  <div class="intro">
    <h1 id="pageTitle">全球职业地图</h1>
    <p id="pageDesc">数据加载中...</p>
  </div>

  <div class="country-tabs" id="countryTabs"></div>

  <div class="controls-row">
    <div class="stat-section">
      <h3>图层</h3>
      <div class="color-toggle" id="colorToggle">
        <button data-mode="share_change" class="active">就业趋势</button>
        <button data-mode="education">学历要求</button>
        <button data-mode="exposure">AI 暴露度</button>
      </div>
    </div>
    <div class="gradient-legend">
      <span id="legendLow">下降</span>
      <canvas id="gradientLegend" width="80" height="8"></canvas>
      <span id="legendHigh">增长</span>
    </div>
  </div>
  <div class="color-legend" id="colorLegend"></div>

  <div class="stats-row">
    <div class="stat-section">
      <h3>总就业人数</h3>
      <div class="stat-big" id="statTotalJobs">&mdash;</div>
    </div>
    <div class="stat-section" id="block2"></div>
    <div class="stat-section" id="block3"></div>
    <div class="stat-section" id="block4"></div>
    <div class="stat-section" id="block5"></div>
    <div class="stat-section" id="block6"></div>
    <div class="stat-section" id="block7"></div>
    <div class="stat-section" id="block8"></div>
  </div>
</div>

<canvas id="canvas"></canvas>
</div>

<div id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-title-en"></div>
  <div class="tt-highlight"></div>
  <div class="tt-stats"></div>
  <div class="tt-rationale"></div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────
let allData = null;
let currentCountry = 'IND';
let colorMode = 'share_change';
let data = [];
let countryMeta = {};
let rects = [];
let hovered = null;

const FLAGS = { IND: '\u{1F1EE}\u{1F1F3}', NGA: '\u{1F1F3}\u{1F1EC}', IDN: '\u{1F1EE}\u{1F1E9}', RUS: '\u{1F1F7}\u{1F1FA}', PAK: '\u{1F1F5}\u{1F1F0}', KEN: '\u{1F1F0}\u{1F1EA}' };

// ── Color scales ────────────────────────────────────────────────────────
function boostContrast(t) {
  const c = (t - 0.5) * 2;
  const b = Math.sign(c) * Math.pow(Math.abs(c), 0.55);
  return b / 2 + 0.5;
}

function greenRedCSS(t, alpha) {
  t = boostContrast(Math.max(0, Math.min(1, t)));
  let r, g, b;
  if (t < 0.5) {
    const s = t / 0.5;
    r = Math.round(30 + s * 200);
    g = Math.round(180 - s * 20);
    b = Math.round(40 - s * 20);
  } else {
    const s = (t - 0.5) / 0.5;
    r = Math.round(230 + s * 25);
    g = Math.round(160 - s * 130);
    b = Math.round(20 - s * 5);
  }
  return `rgba(${r},${g},${b},${alpha})`;
}

function shareChangeColor(v, a) {
  if (v == null) return `rgba(80,80,100,${a})`;
  // Map share change: -5 (red) to +5 (green)
  return greenRedCSS(1 - Math.max(0, Math.min(1, (v + 5) / 10)), a);
}

function eduColor(idx, maxIdx, a) {
  if (idx < 0 || maxIdx <= 0) return `rgba(128,128,128,${a})`;
  return greenRedCSS(1 - idx / maxIdx, a);
}

function exposureColor(v, a) {
  if (v == null) return `rgba(128,128,128,${a})`;
  return greenRedCSS(v / 10, a);
}

function tileColorCSS(d, alpha) {
  if (colorMode === 'exposure') return exposureColor(d.exposure, alpha);
  if (colorMode === 'share_change') return shareChangeColor(d.share_change, alpha);
  if (colorMode === 'education') {
    const maxIdx = (countryMeta.education_system?.levels?.length || 7) - 1;
    return eduColor(d.education_idx, maxIdx, alpha);
  }
  return `rgba(128,128,128,${alpha})`;
}

function tileSubInfo(r) {
  const jobsStr = r.jobs ? formatNumber(r.jobs) : '';
  if (colorMode === 'exposure') {
    return (r.exposure != null ? 'AI ' + r.exposure + '/10' : '') + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  if (colorMode === 'share_change') {
    const s = r.share_change != null ? (r.share_change > 0 ? '+' : '') + r.share_change.toFixed(1) + '\u767e\u5206\u70b9' : '';
    return s + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  if (colorMode === 'education') {
    // Show short education label
    const edu = r.education || '';
    const short = edu.length > 20 ? edu.substring(0, edu.indexOf('（')) || edu.substring(0, 18) + '...' : edu;
    return short + (jobsStr ? ' \u00b7 ' + jobsStr : '');
  }
  return jobsStr;
}

// ── Squarified treemap layout ──────────────────────────────────────────
function squarify(items, x, y, w, h) {
  if (items.length === 0) return [];
  if (items.length === 1) return [{ ...items[0], rx: x, ry: y, rw: w, rh: h }];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (total === 0) return [];
  const results = [];
  let remaining = [...items], cx = x, cy = y, cw = w, ch = h;
  while (remaining.length > 0) {
    const remTotal = remaining.reduce((s, d) => s + d.value, 0);
    const vertical = cw >= ch;
    const side = vertical ? ch : cw;
    let row = [remaining[0]], rowSum = remaining[0].value;
    for (let i = 1; i < remaining.length; i++) {
      const candidate = [...row, remaining[i]];
      const candidateSum = rowSum + remaining[i].value;
      if (worstAspect(candidate, candidateSum, side, remTotal, vertical ? cw : ch) <
          worstAspect(row, rowSum, side, remTotal, vertical ? cw : ch)) {
        row = candidate; rowSum = candidateSum;
      } else break;
    }
    const rowFraction = rowSum / remTotal;
    const rowThickness = vertical ? cw * rowFraction : ch * rowFraction;
    let offset = 0;
    for (const item of row) {
      const itemFraction = item.value / rowSum;
      const itemLength = side * itemFraction;
      if (vertical) results.push({ ...item, rx: cx, ry: cy + offset, rw: rowThickness, rh: itemLength });
      else results.push({ ...item, rx: cx + offset, ry: cy, rw: itemLength, rh: rowThickness });
      offset += itemLength;
    }
    if (vertical) { cx += rowThickness; cw -= rowThickness; }
    else { cy += rowThickness; ch -= rowThickness; }
    remaining = remaining.slice(row.length);
  }
  return results;
}

function worstAspect(row, rowSum, side, totalArea, availableExtent) {
  const rowExtent = availableExtent * (rowSum / totalArea);
  if (rowExtent === 0) return Infinity;
  let worst = 0;
  for (const item of row) {
    const itemLen = side * (item.value / rowSum);
    if (itemLen === 0) continue;
    const aspect = Math.max(rowExtent / itemLen, itemLen / rowExtent);
    if (aspect > worst) worst = aspect;
  }
  return worst;
}

// ── Rendering ──────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
const MARGIN = 12, GAP = 1.5;

function layout() {
  const wrapper = document.getElementById('wrapper');
  const w = wrapper.clientWidth;
  const h = Math.round(w * 3 / 4);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const tx = MARGIN, ty = MARGIN, tw = w - MARGIN * 2, th = h - MARGIN * 2;
  const byCategory = {};
  for (const d of data) { if (!byCategory[d.category]) byCategory[d.category] = []; byCategory[d.category].push(d); }
  const categories = Object.keys(byCategory).map(cat => ({
    cat, items: byCategory[cat].sort((a, b) => (b.jobs || 0) - (a.jobs || 0)),
    value: byCategory[cat].reduce((s, d) => s + (d.jobs || 1), 0),
  })).sort((a, b) => b.value - a.value);
  const catRects = squarify(categories, tx, ty, tw, th);
  rects = [];
  for (const cr of catRects) {
    const items = cr.items.map(d => ({ ...d, value: d.jobs || 1 }));
    const innerRects = squarify(items, cr.rx + GAP, cr.ry + GAP, cr.rw - GAP * 2, cr.rh - GAP * 2);
    for (const ir of innerRects) rects.push(ir);
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  for (const r of rects) {
    const isHovered = r === hovered;
    const g = GAP / 2, rx = r.rx + g, ry = r.ry + g, rw = r.rw - g * 2, rh = r.rh - g * 2;
    if (rw <= 0 || rh <= 0) continue;
    ctx.fillStyle = tileColorCSS(r, isHovered ? 0.8 : 0.5);
    ctx.fillRect(rx, ry, rw, rh);
    if (isHovered) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(rx, ry, rw, rh); }
    if (rw > 50 && rh > 18) {
      ctx.save(); ctx.beginPath(); ctx.rect(rx + 4, ry + 2, rw - 8, rh - 4); ctx.clip();
      const fontSize = Math.min(13, Math.max(9, Math.min(rw / 10, rh / 3)));
      ctx.font = `500 ${fontSize}px -apple-system, system-ui, sans-serif`;
      ctx.fillStyle = isHovered ? '#fff' : 'rgba(255,255,255,0.85)';
      ctx.textBaseline = 'top';
      ctx.fillText(r.title, rx + 5, ry + 4);
      if (rh > 34 && rw > 60) {
        ctx.font = `400 ${Math.max(8, fontSize - 2)}px -apple-system, system-ui, sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(tileSubInfo(r), rx + 5, ry + 4 + fontSize + 2);
      }
      ctx.restore();
    }
  }
}

function hitTest(mx, my) {
  const rect = canvas.getBoundingClientRect();
  const cx = mx - rect.left, cy = my - rect.top;
  for (let i = rects.length - 1; i >= 0; i--) {
    const r = rects[i];
    if (cx >= r.rx && cx < r.rx + r.rw && cy >= r.ry && cy < r.ry + r.rh) return r;
  }
  return null;
}

function formatNumber(n) {
  if (n == null) return '\u2014';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '\u4ebf';
  if (n >= 1e4) return (n / 1e4).toFixed(0) + '\u4e07';
  return n.toLocaleString();
}

function formatNumberEn(n) {
  if (n == null) return '\u2014';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return n.toLocaleString();
}

// ── Tooltip ──────────────────────────────────────────────────────────
function tooltipHighlight(d) {
  if (colorMode === 'exposure') {
    const v = d.exposure;
    if (v == null) return '';
    const color = exposureColor(v, 1);
    return `<span style="color:${color};font-weight:600;">AI 暴露度：${v}/10</span>` +
      `<div style="margin-top:3px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;">` +
      `<div style="height:100%;width:${v * 10}%;background:${color};border-radius:2px;"></div></div>`;
  } else if (colorMode === 'share_change') {
    const v = d.share_change;
    if (v == null) return '<span style="color:var(--fg2);">就业份额变化：无数据</span>';
    const color = shareChangeColor(v, 1);
    return `<span style="color:${color};font-weight:600;">就业份额变化：${v > 0 ? '+' : ''}${v.toFixed(2)}百分点</span>` +
      (d.share_change_desc ? ` <span style="color:var(--fg2);">(${d.share_change_desc})</span>` : '') +
      `<div style="margin-top:3px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;">` +
      `<div style="height:100%;width:${Math.min(100, Math.max(0, (v + 5) / 10 * 100))}%;background:${color};border-radius:2px;"></div></div>`;
  } else if (colorMode === 'education') {
    const edu = d.education || '';
    const maxIdx = (countryMeta.education_system?.levels?.length || 7) - 1;
    const color = d.education_idx >= 0 ? eduColor(d.education_idx, maxIdx, 1) : 'var(--fg)';
    return `<span style="color:${color};font-weight:600;">${edu || '\u2014'}</span>`;
  }
  return '';
}

function showTooltip(d, mx, my) {
  const tt = document.getElementById('tooltip');
  tt.querySelector('.tt-title').textContent = d.title;
  tt.querySelector('.tt-title-en').textContent = d.title_en || '';
  tt.querySelector('.tt-highlight').innerHTML = tooltipHighlight(d);

  const shareStr = d.share_change != null ? (d.share_change > 0 ? '+' : '') + d.share_change.toFixed(2) + '百分点' : '无数据';
  tt.querySelector('.tt-stats').innerHTML = `
    <span class="label">就业人数</span><span class="value">${formatNumber(d.jobs)}</span>
    <span class="label">份额变化</span><span class="value">${shareStr} ${d.share_change_desc ? '(' + d.share_change_desc + ')' : ''}</span>
    <span class="label">学历要求</span><span class="value">${d.education || '\u2014'}</span>
    <span class="label">AI 暴露度</span><span class="value">${d.exposure != null ? d.exposure + '/10' : '\u2014'}</span>
    <span class="label">ISCO 代码</span><span class="value">${d.code || '\u2014'}</span>`;
  tt.querySelector('.tt-rationale').textContent = colorMode === 'exposure' ? (d.exposure_rationale || '') : '';
  let tx = mx + 16, ty = my - 16;
  if (tx + 380 > window.innerWidth) tx = mx - 396;
  if (ty < 10) ty = my + 16;
  if (ty + 240 > window.innerHeight) ty = my - 240;
  tt.style.left = tx + 'px'; tt.style.top = ty + 'px';
  tt.classList.add('visible');
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

// ── Stats helpers ─────────────────────────────────────────────────────
function renderTiers(tiers, totalJobs) {
  return tiers.map(t => `<div class="tier-row">
    <div class="tier-color" style="background:${t.color}"></div>
    <span class="tier-name">${t.label}</span>
    <span class="tier-jobs">${formatNumber(t.jobs)}</span>
    <span class="tier-pct">${totalJobs > 0 ? (t.jobs / totalJobs * 100).toFixed(0) : 0}%</span>
  </div>`).join('');
}

function renderHbars(items) {
  return items.map(it => `<div class="hbar-row">
    <span class="hbar-label" title="${it.label}">${it.label}</span>
    <div class="hbar-track"><div class="hbar-fill" style="width:${it.pct}%;background:${it.color}"></div></div>
    <span class="hbar-val">${it.val}</span>
  </div>`).join('');
}

function weightedAvgByGroups(groups, filterFn, metricFn) {
  return groups.map(g => {
    let wS = 0, wC = 0;
    for (const d of data) {
      const v = metricFn(d);
      if (v != null && d.jobs && filterFn(d, g)) { wS += v * d.jobs; wC += d.jobs; }
    }
    return { ...g, avg: wC > 0 ? wS / wC : 0, jobs: wC };
  });
}

// ── Layer stats ──────────────────────────────────────────────────────
function updateStats() {
  const totalJobs = data.reduce((s, d) => s + (d.jobs || 0), 0);
  document.getElementById('statTotalJobs').textContent = formatNumber(totalJobs);

  if (colorMode === 'share_change') updateShareChangeStats(totalJobs);
  else if (colorMode === 'education') updateEducationStats(totalJobs);
  else if (colorMode === 'exposure') updateExposureStats(totalJobs);
}

function updateShareChangeStats(totalJobs) {
  // Weighted average share change
  let wS = 0, wC = 0;
  for (const d of data) { if (d.share_change != null && d.jobs) { wS += d.share_change * d.jobs; wC += d.jobs; } }
  const avg = wC > 0 ? wS / wC : 0;
  const hasShareData = wC > 0;

  document.getElementById('block2').innerHTML = hasShareData ? `<h3>平均份额变化</h3>
    <div class="stat-big"><span style="color:${shareChangeColor(avg, 1)}">${avg > 0 ? '+' : ''}${avg.toFixed(2)}百分点</span></div>
    <div class="stat-label">就业加权</div>` : `<h3>职业分类数</h3>
    <div class="stat-big">${countryMeta.occ_count || data.length}</div>
    <div class="stat-label">ISCO 分类</div>`;

  // Histogram: jobs by share change buckets
  if (hasShareData) {
    const buckets = [
      { lo: -Infinity, hi: -2, mid: -4 }, { lo: -2, hi: -0.5, mid: -1.2 }, { lo: -0.5, hi: 0.5, mid: 0 },
      { lo: 0.5, hi: 2, mid: 1.2 }, { lo: 2, hi: Infinity, mid: 4 },
    ];
    const histJobs = buckets.map(() => 0);
    for (const d of data) { if (d.share_change != null && d.jobs) { const i = buckets.findIndex(b => d.share_change >= b.lo && d.share_change < b.hi); if (i >= 0) histJobs[i] += d.jobs; } }
    const maxH = Math.max(...histJobs);
    document.getElementById('block3').innerHTML = `<h3>各趋势就业分布</h3>
      <div class="histogram">${histJobs.map((c, i) => `<div class="bar" style="height:${Math.max(2, maxH > 0 ? c / maxH * 100 : 0)}%;background:${shareChangeColor(buckets[i].mid, 0.7)}"></div>`).join('')}</div>
      <div class="hist-labels"><span>-5百分点</span><span>0</span><span>+5百分点</span></div>`;

    // Tiers
    const tierDefs = [
      { label: '下降 (<-1百分点)', min: -Infinity, max: -1, mid: -3 },
      { label: '微降 (-1~0)', min: -1, max: -0.01, mid: -0.5 },
      { label: '稳定 (~0)', min: -0.01, max: 0.01, mid: 0 },
      { label: '微升 (0~+1)', min: 0.01, max: 1, mid: 0.5 },
      { label: '增长 (>+1百分点)', min: 1, max: Infinity, mid: 3 },
    ];
    const tiers = tierDefs.map(t => {
      let jobs = 0;
      for (const d of data) { if (d.share_change != null && d.jobs && d.share_change >= t.min && d.share_change < t.max) jobs += d.jobs; }
      return { ...t, label: t.label, jobs, color: shareChangeColor(t.mid, 1) };
    });
    document.getElementById('block4').innerHTML = `<h3>趋势分层</h3><div class="tier-bar">${renderTiers(tiers, totalJobs)}</div>`;
  } else {
    document.getElementById('block3').innerHTML = `<h3>数据年份</h3><div class="stat-big" style="font-size:24px">${countryMeta.data_year || '--'}</div>`;
    document.getElementById('block4').innerHTML = '';
  }

  // Cross: share change by major group (top gainers/losers)
  if (hasShareData) {
    const byMajor = {};
    for (const d of data) {
      if (d.share_change != null && d.jobs) {
        const major = d.category;
        if (!byMajor[major]) byMajor[major] = { wS: 0, wC: 0, label: major.split('-')[1] || major };
        byMajor[major].wS += d.share_change * d.jobs;
        byMajor[major].wC += d.jobs;
      }
    }
    const majorList = Object.values(byMajor).map(g => ({ ...g, avg: g.wC > 0 ? g.wS / g.wC : 0 })).sort((a, b) => b.avg - a.avg);
    const top5 = majorList.slice(0, 5);
    document.getElementById('block5').innerHTML = `<h3>增长最快行业</h3><div class="hbar-chart">${renderHbars(top5.map(g => ({
      label: g.label.substring(0, 12), val: (g.avg > 0 ? '+' : '') + g.avg.toFixed(1) + '\u767e\u5206\u70b9',
      pct: Math.max(0, Math.min(100, (g.avg + 5) / 10 * 100)), color: shareChangeColor(g.avg, 0.8)
    })))}</div>`;

    const bottom5 = majorList.slice(-5).reverse();
    document.getElementById('block6').innerHTML = `<h3>下降最快行业</h3><div class="hbar-chart">${renderHbars(bottom5.map(g => ({
      label: g.label.substring(0, 12), val: (g.avg > 0 ? '+' : '') + g.avg.toFixed(1) + '\u767e\u5206\u70b9',
      pct: Math.max(0, Math.min(100, (g.avg + 5) / 10 * 100)), color: shareChangeColor(g.avg, 0.8)
    })))}</div>`;
  } else {
    document.getElementById('block5').innerHTML = '';
    document.getElementById('block6').innerHTML = '';
  }

  // Declining/growing total jobs
  let declining = 0, growing = 0;
  for (const d of data) {
    if (d.share_change != null && d.jobs) {
      if (d.share_change < 0) declining += d.jobs;
      else if (d.share_change > 0) growing += d.jobs;
    }
  }
  if (hasShareData) {
    document.getElementById('block7').innerHTML = `<h3>下降行业就业</h3>
      <div class="stat-big" style="color:${shareChangeColor(-3, 1)}">${formatNumber(declining)}</div>
      <div class="stat-label">负增长趋势</div>`;
    document.getElementById('block8').innerHTML = `<h3>增长行业就业</h3>
      <div class="stat-big" style="color:${shareChangeColor(3, 1)}">${formatNumber(growing)}</div>
      <div class="stat-label">正增长趋势</div>`;
  } else {
    document.getElementById('block7').innerHTML = `<h3>数据来源</h3><div class="stat-label" style="font-size:12px;margin-top:4px">${countryMeta.source || 'ILO ILOSTAT'}</div>`;
    document.getElementById('block8').innerHTML = '';
  }
}

function updateEducationStats(totalJobs) {
  const levels = countryMeta.education_system?.levels || [];
  const maxIdx = levels.length - 1;

  // Headline: % higher education (idx >= 4)
  let highEduJobs = 0;
  for (const d of data) { if (d.jobs && d.education_idx >= 4) highEduJobs += d.jobs; }
  document.getElementById('block2').innerHTML = `<h3>高等教育占比</h3>
    <div class="stat-big"><span style="color:${eduColor(4, maxIdx, 1)}">${(highEduJobs / totalJobs * 100).toFixed(0)}%</span></div>
    <div class="stat-label">本科及以上</div>`;

  // Histogram: jobs by education level
  const groups = levels.map((lev, i) => {
    let jobs = 0;
    for (const d of data) { if (d.jobs && d.education_idx === i) jobs += d.jobs; }
    return { label: lev[0].substring(0, lev[0].indexOf('（')) || lev[0].substring(0, 12), label_full: lev[0], jobs, idx: i };
  });
  const maxH = Math.max(...groups.map(g => g.jobs));
  document.getElementById('block3').innerHTML = `<h3>各学历就业分布</h3>
    <div class="histogram">${groups.map(g => `<div class="bar" style="height:${Math.max(2, maxH > 0 ? g.jobs / maxH * 100 : 0)}%;background:${eduColor(g.idx, maxIdx, 0.7)}"></div>`).join('')}</div>
    <div class="hist-labels"><span>${levels.length > 0 ? levels[0][1].substring(0, 10) : '低'}</span><span>${levels.length > 0 ? levels[levels.length-1][1].substring(0, 10) : '高'}</span></div>`;

  // Tier breakdown
  const tiers = groups.map(g => ({ label: g.label, jobs: g.jobs, color: eduColor(g.idx, maxIdx, 1) }));
  document.getElementById('block4').innerHTML = `<h3>学历分层</h3><div class="tier-bar">${renderTiers(tiers, totalJobs)}</div>`;

  // Cross: avg exposure by education
  const eduGroups = levels.map((lev, i) => ({
    label: lev[0].substring(0, lev[0].indexOf('（')) || lev[0].substring(0, 12),
    idx: i,
  }));
  const expByEdu = weightedAvgByGroups(eduGroups, (d, g) => d.education_idx === g.idx, d => d.exposure);
  document.getElementById('block5').innerHTML = `<h3>各学历 AI 暴露度</h3><div class="hbar-chart">${renderHbars(expByEdu.map(g => ({
    label: g.label, val: g.avg.toFixed(1), pct: g.avg / 10 * 100, color: exposureColor(g.avg, 0.8)
  })))}</div>`;

  // Cross: share change by education
  const shareByEdu = weightedAvgByGroups(eduGroups, (d, g) => d.education_idx === g.idx, d => d.share_change);
  const hasShare = shareByEdu.some(g => g.jobs > 0 && g.avg !== 0);
  if (hasShare) {
    document.getElementById('block6').innerHTML = `<h3>各学历就业趋势</h3><div class="hbar-chart">${renderHbars(shareByEdu.map(g => ({
      label: g.label, val: (g.avg > 0 ? '+' : '') + g.avg.toFixed(1) + '\u767e\u5206\u70b9',
      pct: Math.max(0, Math.min(100, (g.avg + 5) / 10 * 100)), color: shareChangeColor(g.avg, 0.8)
    })))}</div>`;
  } else {
    document.getElementById('block6').innerHTML = '';
  }

  // Impact
  let lowEdu = 0;
  for (const d of data) { if (d.jobs && d.education_idx <= 1) lowEdu += d.jobs; }
  document.getElementById('block7').innerHTML = `<h3>低学历就业</h3>
    <div class="stat-big">${formatNumber(lowEdu)}</div>
    <div class="stat-label">初中及以下岗位</div>`;
  document.getElementById('block8').innerHTML = '';
}

function updateExposureStats(totalJobs) {
  let wS = 0, wC = 0;
  for (const d of data) { if (d.exposure != null && d.jobs) { wS += d.exposure * d.jobs; wC += d.jobs; } }
  const avg = wC > 0 ? wS / wC : 0;
  document.getElementById('block2').innerHTML = `<h3>平均暴露度</h3>
    <div class="stat-big"><span style="color:${exposureColor(avg, 1)}">${avg.toFixed(1)}</span></div>
    <div class="stat-label">就业加权，0\u201310</div>`;

  // Histogram
  const histogram = new Array(11).fill(0);
  for (const d of data) { if (d.exposure != null && d.jobs) histogram[d.exposure] += d.jobs; }
  const maxH = Math.max(...histogram);
  document.getElementById('block3').innerHTML = `<h3>各暴露度就业分布</h3>
    <div class="histogram">${histogram.map((c, i) => `<div class="bar" style="height:${Math.max(2, maxH > 0 ? c / maxH * 100 : 0)}%;background:${exposureColor(i, 0.7)}"></div>`).join('')}</div>
    <div class="hist-labels"><span>0</span><span>5</span><span>10</span></div>`;

  // Tiers
  const tierDefs = [
    { label: '极低 (0\u20131)', lo: 0, hi: 1, mid: 0.5 },
    { label: '低 (2\u20133)', lo: 2, hi: 3, mid: 2.5 },
    { label: '中等 (4\u20135)', lo: 4, hi: 5, mid: 4.5 },
    { label: '高 (6\u20137)', lo: 6, hi: 7, mid: 6.5 },
    { label: '极高 (8\u201310)', lo: 8, hi: 10, mid: 9 },
  ];
  const tiers = tierDefs.map(t => {
    let jobs = 0;
    for (const d of data) { if (d.exposure != null && d.jobs && d.exposure >= t.lo && d.exposure <= t.hi) jobs += d.jobs; }
    return { ...t, jobs, color: exposureColor(t.mid, 1) };
  });
  document.getElementById('block4').innerHTML = `<h3>暴露度分层</h3><div class="tier-bar">${renderTiers(tiers, totalJobs)}</div>`;

  // Cross: exposure by major group
  const byMajor = {};
  for (const d of data) {
    if (d.exposure != null && d.jobs) {
      const major = d.category;
      if (!byMajor[major]) byMajor[major] = { wS: 0, wC: 0, label: major.split('-')[1] || major };
      byMajor[major].wS += d.exposure * d.jobs;
      byMajor[major].wC += d.jobs;
    }
  }
  const majorList = Object.values(byMajor).map(g => ({ ...g, avg: g.wC > 0 ? g.wS / g.wC : 0 })).sort((a, b) => b.avg - a.avg);
  document.getElementById('block5').innerHTML = `<h3>各行业 AI 暴露度</h3><div class="hbar-chart">${renderHbars(majorList.slice(0, 6).map(g => ({
    label: g.label.substring(0, 12), val: g.avg.toFixed(1), pct: g.avg / 10 * 100, color: exposureColor(g.avg, 0.8)
  })))}</div>`;

  // Cross: exposure by education
  const levels = countryMeta.education_system?.levels || [];
  const eduGroups = levels.map((lev, i) => ({
    label: lev[0].substring(0, lev[0].indexOf('（')) || lev[0].substring(0, 12),
    idx: i,
  }));
  const byEdu = weightedAvgByGroups(eduGroups, (d, g) => d.education_idx === g.idx, d => d.exposure);
  document.getElementById('block6').innerHTML = `<h3>各学历 AI 暴露度</h3><div class="hbar-chart">${renderHbars(byEdu.map(g => ({
    label: g.label, val: g.avg.toFixed(1), pct: g.avg / 10 * 100, color: exposureColor(g.avg, 0.8)
  })))}</div>`;

  // Impact: high exposure jobs
  let highExpJobs = 0;
  for (const d of data) { if (d.exposure != null && d.exposure >= 7 && d.jobs) highExpJobs += d.jobs; }
  document.getElementById('block7').innerHTML = `<h3>高暴露岗位</h3>
    <div class="stat-big" style="color:${exposureColor(8, 1)}">${formatNumber(highExpJobs)}</div>
    <div class="stat-label">7分及以上</div>`;

  let lowExpJobs = 0;
  for (const d of data) { if (d.exposure != null && d.exposure <= 2 && d.jobs) lowExpJobs += d.jobs; }
  document.getElementById('block8').innerHTML = `<h3>低暴露岗位</h3>
    <div class="stat-big" style="color:${exposureColor(1, 1)}">${formatNumber(lowExpJobs)}</div>
    <div class="stat-label">0\u20132分</div>`;
}

// ── Events ─────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', (e) => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit !== hovered) { hovered = hit; draw(); }
  if (hovered) { showTooltip(hovered, e.clientX, e.clientY); canvas.style.cursor = 'pointer'; }
  else { hideTooltip(); canvas.style.cursor = 'default'; }
});
canvas.addEventListener('mouseleave', () => { hovered = null; hideTooltip(); draw(); });
function resize() { dpr = window.devicePixelRatio || 1; layout(); draw(); }

// ── Legend gradient ────────────────────────────────────────────────────
const LEGEND_CONFIG = {
  exposure:     { low: '低', high: '高' },
  share_change: { low: '下降', high: '增长' },
  education:    { low: '无学历', high: '博士' },
};

function drawGradientLegend() {
  const c = document.getElementById('gradientLegend');
  const gctx = c.getContext('2d');
  for (let x = 0; x < 80; x++) {
    const t = x / 79;
    gctx.fillStyle = colorMode === 'exposure' ? greenRedCSS(t, 1) : greenRedCSS(1 - t, 1);
    gctx.fillRect(x, 0, 1, 8);
  }
  const cfg = LEGEND_CONFIG[colorMode];
  document.getElementById('legendLow').textContent = cfg.low;
  document.getElementById('legendHigh').textContent = cfg.high;
  updateColorLegend();
}

function updateColorLegend() {
  const el = document.getElementById('colorLegend');
  let items = [];

  if (colorMode === 'share_change') {
    items = [
      { color: shareChangeColor(4, 0.7),  label: '\u5927\u5e45\u589e\u957f (>+2\u767e\u5206\u70b9)' },
      { color: shareChangeColor(1.5, 0.7), label: '\u5fae\u5347 (0~+2)' },
      { color: shareChangeColor(-1.5, 0.7), label: '\u5fae\u964d (-2~0)' },
      { color: shareChangeColor(-4, 0.7), label: '\u5927\u5e45\u4e0b\u964d (<-2\u767e\u5206\u70b9)' },
      { color: 'rgba(80,80,100,0.5)', label: '\u7070\u8272 = \u65e0\u5386\u53f2\u6570\u636e' },
    ];
  } else if (colorMode === 'education') {
    const levels = countryMeta.education_system?.levels || [];
    const maxIdx = levels.length - 1;
    items = levels.map((lev, i) => ({
      color: eduColor(i, maxIdx, 0.7),
      label: lev[0].substring(0, lev[0].indexOf('\uff08')) || lev[0],
    }));
  } else if (colorMode === 'exposure') {
    items = [
      { color: exposureColor(0.5, 0.7), label: '\u6781\u4f4e (0\u20131\u5206)' },
      { color: exposureColor(2.5, 0.7), label: '\u4f4e (2\u20133\u5206)' },
      { color: exposureColor(4.5, 0.7), label: '\u4e2d\u7b49 (4\u20135\u5206)' },
      { color: exposureColor(6.5, 0.7), label: '\u9ad8 (6\u20137\u5206)' },
      { color: exposureColor(9, 0.7),   label: '\u6781\u9ad8 (8\u201310\u5206)' },
      { color: 'rgba(128,128,128,0.5)', label: '\u7070\u8272 = \u65e0\u6570\u636e' },
    ];
  }

  el.innerHTML = items.map(it =>
    `<span class="color-legend-item"><span class="color-legend-swatch" style="background:${it.color}"></span>${it.label}</span>`
  ).join('');
}

// ── Layer toggle ─────────────────────────────────────────────────────
document.getElementById('colorToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || !btn.dataset.mode) return;
  colorMode = btn.dataset.mode;
  document.querySelectorAll('#colorToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateStats();
  drawGradientLegend();
  draw();
  requestAnimationFrame(resize);
});

// ── Country switch ───────────────────────────────────────────────────
function switchCountry(cc) {
  currentCountry = cc;
  const cdata = allData.countries[cc];
  countryMeta = cdata;
  data = cdata.occupations;

  // Update tabs
  document.querySelectorAll('.country-tab').forEach(t => t.classList.toggle('active', t.dataset.cc === cc));

  // Update title/description + clickable source links
  document.getElementById('pageTitle').textContent = cdata.title;
  const EXT_ICON = `<svg class="ext-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2H2.2C1.5 2 1 2.5 1 3.2v6.6C1 10.5 1.5 11 2.2 11h6.6c.7 0 1.2-.5 1.2-1.2V7.5"/><path d="M7 1h4v4"/><path d="M11 1L5.5 6.5"/></svg>`;
  let sourceHtml = '';
  if (cdata.source_links && cdata.source_links.length > 0) {
    sourceHtml = `<div class="source-tags"><span class="source-tag" style="border:none;background:none;padding-left:0">数据来源：</span>` +
      cdata.source_links.map(l =>
        `<a class="source-tag" href="${l.url}" target="_blank" rel="noopener noreferrer" title="${l.url}">${l.label}${EXT_ICON}</a>`
      ).join('') + `</div>`;
  } else {
    sourceHtml = `<div class="source-tags"><span class="source-tag">${cdata.source}</span></div>`;
  }
  document.getElementById('pageDesc').innerHTML = cdata.description + sourceHtml;

  // Refresh viz
  updateStats();
  drawGradientLegend();
  resize();
}

function buildCountryTabs() {
  const container = document.getElementById('countryTabs');
  container.innerHTML = '';
  const order = ['IND', 'IDN', 'PAK', 'NGA', 'KEN', 'RUS'];
  for (const cc of order) {
    const cdata = allData.countries[cc];
    if (!cdata) continue;
    const btn = document.createElement('button');
    btn.className = 'country-tab';
    btn.dataset.cc = cc;
    btn.innerHTML = `<span class="flag">${FLAGS[cc] || ''}</span> ${cdata.name_cn} <span class="jobs-count">${formatNumber(cdata.total_jobs)}人</span>`;
    btn.addEventListener('click', () => switchCountry(cc));
    container.appendChild(btn);
  }
}

// ── Load ───────────────────────────────────────────────────────────────
fetch('data.json')
  .then(r => r.json())
  .then(d => {
    allData = d;
    buildCountryTabs();
    switchCountry('IND');
  })
  .catch(err => {
    document.getElementById('pageDesc').textContent = '数据加载失败：' + err.message;
  });

window.addEventListener('resize', resize);
</script>
